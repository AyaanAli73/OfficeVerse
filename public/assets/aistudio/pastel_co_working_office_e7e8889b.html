<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pastel Co-Working Office — 3D Isometric Environment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-top: #939ba8;
      --bg-bottom: #7c8492;
      --panel-bg: rgba(255, 255, 255, 0.86);
      --panel-border: rgba(255, 255, 255, 0.65);
      --accent-pink: #f08cae;
      --accent-Pink-dark: #d96b90;
      --accent-lavender: #9b82f3;
      --text-dark: #252830;
      --text-muted: #5a6070;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at 50% 42%, #9ea7b5 0%, #838b99 58%, #707887 100%);
      color: var(--text-dark);
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .ui-overlay {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 320px;
      pointer-events: none;
    }

    .ui-card {
      pointer-events: auto;
      background: var(--panel-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: 0 12px 32px rgba(26, 30, 42, 0.16), 0 2px 6px rgba(26, 30, 42, 0.08);
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }

    .swatch-dots {
      display: flex;
      gap: 5px;
    }

    .swatch-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.12);
    }

    .ui-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-dark);
    }

    .ui-subtitle {
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 12px;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .ui-btn {
      appearance: none;
      border: 1px solid rgba(37, 40, 48, 0.1);
      background: rgba(255, 255, 255, 0.9);
      color: var(--text-dark);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 7px 11px;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.18s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.04);
    }

    .ui-btn:hover {
      background: #ffffff;
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      border-color: rgba(240, 140, 174, 0.5);
    }

    .ui-btn.active {
      background: linear-gradient(135deg, #f38fb0 0%, #c48ef5 100%);
      color: #ffffff;
      border-color: transparent;
      box-shadow: 0 4px 12px rgba(240, 140, 174, 0.38);
    }

    .ui-hint {
      font-size: 10.5px;
      color: var(--text-muted);
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(0, 0, 0, 0.06);
      display: flex;
      justify-content: space-between;
    }

    /* Asset Breakdown Floating 3D Labels */
    #labels-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      overflow: hidden;
    }

    .asset-label {
      position: absolute;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      border: 1.5px solid #f08cae;
      border-radius: 999px;
      padding: 3px 9px 3px 4px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: #252830;
      box-shadow: 0 4px 14px rgba(24, 28, 40, 0.22);
      white-space: nowrap;
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: auto;
      cursor: default;
    }

    .asset-label:hover {
      transform: translate(-50%, -50%) scale(1.08);
      z-index: 25;
      background: #ffffff;
    }

    .asset-badge {
      background: linear-gradient(135deg, #f08cae, #d96b90);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 5.5px;
      border-radius: 999px;
      letter-spacing: 0.02em;
    }

    .hidden {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    /* Companion Robot Studio Controls Card */
    .robot-section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin: 10px 0 6px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .robot-status-pill {
      background: rgba(240, 140, 174, 0.18);
      color: #b84b72;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      text-transform: capitalize;
    }

    .robot-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
    }

    .robot-mini-btn {
      appearance: none;
      border: 1px solid rgba(37, 40, 48, 0.09);
      background: rgba(255, 255, 255, 0.78);
      color: var(--text-dark);
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      padding: 5px 6px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.16s ease;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .robot-mini-btn:hover {
      background: #ffffff;
      border-color: rgba(240, 140, 174, 0.55);
      transform: translateY(-1px);
    }

    .robot-mini-btn.active {
      background: linear-gradient(135deg, #f38fb0 0%, #c48ef5 100%);
      color: #ffffff;
      border-color: transparent;
      box-shadow: 0 3px 9px rgba(240, 140, 174, 0.34);
    }

    @media (max-width: 640px) {
      .ui-overlay {
        top: 10px;
        left: 10px;
        right: 10px;
        max-width: none;
      }
      .ui-card {
        padding: 10px 12px;
      }
    }
  </style>

  <!-- Import Maps for Three.js ES Modules -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="labels-container" class="hidden"></div>

  <div class="ui-overlay">
    <div class="ui-card">
      <div class="title-row">
        <div class="swatch-dots">
          <span class="swatch-dot" style="background:#f39bb8;"></span>
          <span class="swatch-dot" style="background:#f7c59f;"></span>
          <span class="swatch-dot" style="background:#a78bfa;"></span>
        </div>
        <div class="ui-title">Pastel Co-Working Office</div>
      </div>
      <div class="ui-subtitle">Isometric 3D Architectural Diorama &bull; Procedural Assets</div>
      <div class="btn-row">
        <button id="btn-reset" class="ui-btn" title="Return to exact reference isometric angle">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          Reset Camera
        </button>
        <button id="btn-wireframe" class="ui-btn" title="Toggle 3D mesh wireframe">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/><path d="M15 3v18"/></svg>
          Wireframe
        </button>
        <button id="btn-labels" class="ui-btn" title="Toggle numbered asset breakdown markers">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
          Asset Labels
        </button>
        <button id="btn-focus-robot" class="ui-btn" title="Zoom camera to Companion Robot">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></svg>
          Focus Robot
        </button>
      </div>

      <!-- Companion Robot Expressions & Actions -->
      <div class="robot-section-title">
        <span>Robot Expressions</span>
        <span id="robot-expr-status" class="robot-status-pill">Happy</span>
      </div>
      <div class="robot-grid">
        <button class="robot-mini-btn active" data-robot-expr="happy">Happy</button>
        <button class="robot-mini-btn" data-robot-expr="excited">Excited</button>
        <button class="robot-mini-btn" data-robot-expr="wink">Wink</button>
        <button class="robot-mini-btn" data-robot-expr="love">Love</button>
        <button class="robot-mini-btn" data-robot-expr="curious">Curious</button>
        <button class="robot-mini-btn" data-robot-expr="surprised">Surprised</button>
        <button class="robot-mini-btn" data-robot-expr="sleepy">Sleepy</button>
        <button class="robot-mini-btn" data-robot-expr="sad">Sad</button>
        <button class="robot-mini-btn" id="btn-robot-blink">Blink</button>
      </div>

      <div class="robot-section-title">
        <span>Robot Actions</span>
        <span id="robot-action-status" class="robot-status-pill">Idle</span>
      </div>
      <div class="robot-grid">
        <button class="robot-mini-btn active" data-robot-action="idle">Idle</button>
        <button class="robot-mini-btn" data-robot-action="patrol">Patrol Office</button>
        <button class="robot-mini-btn" data-robot-action="wave">Wave</button>
        <button class="robot-mini-btn" data-robot-action="dance">Dance</button>
        <button class="robot-mini-btn" data-robot-action="bounce">Bounce</button>
        <button class="robot-mini-btn" data-robot-action="celebrate">Celebrate</button>
        <button class="robot-mini-btn" data-robot-action="curious">Head Tilt</button>
        <button class="robot-mini-btn" data-robot-action="bow">Bow</button>
        <button class="robot-mini-btn" data-robot-action="sleep">Sleep</button>
      </div>

      <div class="ui-hint">
        <span>Drag: Orbit &bull; Scroll: Zoom &bull; Right-Drag: Pan</span>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    // ============================================================================
    // 1. SCENE, RENDERER, STUDIO ENVIRONMENT & ORTHOGRAPHIC CAMERA
    // ============================================================================
    const container = document.getElementById('canvas-container');
    const labelsContainer = document.getElementById('labels-container');

    const scene = new THREE.Scene();

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance',
      alpha: true
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.90;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // Subtle Studio PBR Environment Map for soft specular highlights without washing out shadows
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    pmremGenerator.compileEquirectangularShader();
    const envTexture = pmremGenerator.fromScene(new RoomEnvironment(renderer), 0.04).texture;
    scene.environment = envTexture;
    scene.environmentIntensity = 0.16;

    // Orthographic camera matching the exact high 3/4 isometric perspective of the reference
    const frustumSize = 15.0;
    const aspect = window.innerWidth / window.innerHeight;
    const camera = new THREE.OrthographicCamera(
      (-frustumSize * aspect) / 2,
      (frustumSize * aspect) / 2,
      frustumSize / 2,
      -frustumSize / 2,
      0.1,
      120
    );

    const DEFAULT_CAM_POS = new THREE.Vector3(-15.6, 13.4, -15.6);
    const DEFAULT_TARGET = new THREE.Vector3(0.0, 1.25, 0.0);
    const DEFAULT_ZOOM = 1.09;

    camera.position.copy(DEFAULT_CAM_POS);
    camera.zoom = DEFAULT_ZOOM;
    camera.updateProjectionMatrix();

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.copy(DEFAULT_TARGET);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxPolarAngle = Math.PI / 2 - 0.05;
    controls.minPolarAngle = 0.25;
    controls.minZoom = 0.55;
    controls.maxZoom = 3.2;
    controls.update();

    // ============================================================================
    // 2. COLOR PALETTE & SHARED PBR MATERIALS
    // ============================================================================
    const allMaterials = [];
    function registerMat(mat) {
      allMaterials.push(mat);
      return mat;
    }

    // Subtle procedural noise/bump texture for fabric and upholstery
    function createFabricTexture(baseHex, contrast = 18, size = 128) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      ctx.fillStyle = baseHex;
      ctx.fillRect(0, 0, size, size);
      const img = ctx.getImageData(0, 0, size, size);
      const d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        const n = (Math.random() - 0.5) * contrast;
        d[i] = Math.min(255, Math.max(0, d[i] + n));
        d[i + 1] = Math.min(255, Math.max(0, d[i + 1] + n));
        d[i + 2] = Math.min(255, Math.max(0, d[i + 2] + n));
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(6, 6);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // Embossed botanical/scroll woven texture for the soft gray area rugs
    function createRugTexture(baseHex = '#b8b0b5') {
      const c = document.createElement('canvas');
      c.width = c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = baseHex;
      ctx.fillRect(0, 0, 512, 512);

      // Subtle ornamental scroll medallions like the reference rug
      ctx.strokeStyle = 'rgba(132, 122, 128, 0.34)';
      ctx.lineWidth = 4.5;
      for (let gx = 32; gx < 512; gx += 64) {
        for (let gy = 32; gy < 512; gy += 64) {
          ctx.beginPath();
          ctx.arc(gx, gy, 21, 0, Math.PI * 1.65);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(gx + 10, gy - 8, 9, 0, Math.PI * 1.4);
          ctx.stroke();
        }
      }

      // Fine woven wool fibers
      for (let i = 0; i < 10000; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        const r = 2 + Math.random() * 6;
        ctx.strokeStyle = i % 2 === 0 ? 'rgba(240,235,238,0.22)' : 'rgba(105,96,102,0.22)';
        ctx.lineWidth = 1.3;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 1.3);
        ctx.stroke();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(3, 3);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // Rich warm honey-oak wood grain texture matching the golden-peach oak floor in the reference
    function createOakGrainTexture(baseHex = '#df9f66') {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 128;
      const ctx = c.getContext('2d');
      ctx.fillStyle = baseHex;
      ctx.fillRect(0, 0, 512, 128);

      // Warm linear wood grain fibers
      for (let i = 0; i < 220; i++) {
        ctx.fillStyle = i % 2 === 0 ? 'rgba(148, 82, 28, 0.12)' : 'rgba(255, 218, 178, 0.12)';
        const y = Math.random() * 128;
        ctx.fillRect(0, y, 512, 1 + Math.random() * 2.6);
      }

      // Gentle cathedral grain arches
      ctx.strokeStyle = 'rgba(138, 76, 24, 0.10)';
      ctx.lineWidth = 1.8;
      for (let k = 0; k < 12; k++) {
        const cx = Math.random() * 512;
        const cy = Math.random() * 128;
        ctx.beginPath();
        ctx.ellipse(cx, cy, 60 + Math.random() * 95, 8 + Math.random() * 15, 0, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Subtle dark plank border edge for crisp individual plank definition
      ctx.strokeStyle = 'rgba(115, 62, 18, 0.22)';
      ctx.lineWidth = 3;
      ctx.strokeRect(1, 1, 510, 126);

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 4;
      return tex;
    }

    const oakTex1 = createOakGrainTexture('#e2a36b');
    const oakTex2 = createOakGrainTexture('#d8965c');
    const oakTex3 = createOakGrainTexture('#e7ab74');
    const oakTex4 = createOakGrainTexture('#d18e54');

    const MAT = {
      wallWhite: registerMat(new THREE.MeshStandardMaterial({
        color: 0xeae1dc,
        roughness: 0.62,
        metalness: 0.01
      })),
      furnitureWhite: registerMat(new THREE.MeshStandardMaterial({
        color: 0xf2eae4,
        roughness: 0.45,
        metalness: 0.02
      })),
      softGrayTrim: registerMat(new THREE.MeshStandardMaterial({
        color: 0x8d94a2,
        roughness: 0.50,
        metalness: 0.08
      })),
      platformGray: registerMat(new THREE.MeshStandardMaterial({
        color: 0x747b8a,
        roughness: 0.55,
        metalness: 0.10
      })),
      pastelPink: registerMat(new THREE.MeshStandardMaterial({
        color: 0xec82a6,
        roughness: 0.46,
        metalness: 0.02
      })),
      pastelPinkFabric: registerMat(new THREE.MeshStandardMaterial({
        map: createFabricTexture('#e87a9f', 16),
        roughness: 0.78,
        metalness: 0.0
      })),
      deepPink: registerMat(new THREE.MeshStandardMaterial({
        color: 0xd9648a,
        roughness: 0.50,
        metalness: 0.02
      })),
      lavenderFabric: registerMat(new THREE.MeshStandardMaterial({
        map: createFabricTexture('#926fe2', 16),
        roughness: 0.78,
        metalness: 0.0
      })),
      sofaFabric: registerMat(new THREE.MeshStandardMaterial({
        map: createFabricTexture('#dfd6d9', 14),
        roughness: 0.82,
        metalness: 0.0
      })),
      rugGray: registerMat(new THREE.MeshStandardMaterial({
        map: createRugTexture('#b7afb4'),
        bumpMap: createRugTexture('#808080'),
        bumpScale: 0.018,
        roughness: 0.90,
        metalness: 0.0
      })),
      oakPlanks: [
        registerMat(new THREE.MeshStandardMaterial({ map: oakTex1, roughness: 0.46, metalness: 0.02 })),
        registerMat(new THREE.MeshStandardMaterial({ map: oakTex2, roughness: 0.48, metalness: 0.02 })),
        registerMat(new THREE.MeshStandardMaterial({ map: oakTex3, roughness: 0.44, metalness: 0.02 })),
        registerMat(new THREE.MeshStandardMaterial({ map: oakTex4, roughness: 0.50, metalness: 0.02 }))
      ],
      paleWood: registerMat(new THREE.MeshStandardMaterial({
        map: oakTex3,
        color: 0xedd0b0,
        roughness: 0.48,
        metalness: 0.02
      })),
      darkMetal: registerMat(new THREE.MeshStandardMaterial({
        color: 0x1e2129,
        roughness: 0.30,
        metalness: 0.65
      })),
      charcoalPlastic: registerMat(new THREE.MeshStandardMaterial({
        color: 0x262a34,
        roughness: 0.36,
        metalness: 0.20
      })),
      chromeMetal: registerMat(new THREE.MeshStandardMaterial({
        color: 0xd8dde6,
        roughness: 0.20,
        metalness: 0.85
      })),
      glassBlue: registerMat(new THREE.MeshPhysicalMaterial({
        color: 0x8ce0fa,
        transparent: true,
        opacity: 0.28,
        roughness: 0.08,
        metalness: 0.05,
        reflectivity: 0.92,
        depthWrite: false,
        side: THREE.DoubleSide
      })),
      glassEdge: registerMat(new THREE.MeshBasicMaterial({
        color: 0x56d4f8,
        transparent: true,
        opacity: 0.82
      })),
      warmLed: registerMat(new THREE.MeshBasicMaterial({
        color: 0xffe8b8
      })),
      warmLedSoft: registerMat(new THREE.MeshBasicMaterial({
        color: 0xffcf78
      })),
      leafGreens: [
        registerMat(new THREE.MeshStandardMaterial({ color: 0x467e27, roughness: 0.38, side: THREE.DoubleSide })),
        registerMat(new THREE.MeshStandardMaterial({ color: 0x5d9936, roughness: 0.35, side: THREE.DoubleSide })),
        registerMat(new THREE.MeshStandardMaterial({ color: 0x33641b, roughness: 0.42, side: THREE.DoubleSide })),
        registerMat(new THREE.MeshStandardMaterial({ color: 0x74b048, roughness: 0.36, side: THREE.DoubleSide }))
      ],
      soilDark: registerMat(new THREE.MeshStandardMaterial({ color: 0x3f2e21, roughness: 0.9 })),
      potBeige: registerMat(new THREE.MeshStandardMaterial({ color: 0xe3cdb8, roughness: 0.48 })),
      potTerracotta: registerMat(new THREE.MeshStandardMaterial({ color: 0xc2855c, roughness: 0.52 }))
    };

    // ============================================================================
    // 3. REUSABLE COMPONENT & GEOMETRY HELPERS
    // ============================================================================
    const roundedBoxCache = new Map();
    function createRoundedBox(w, h, d, radius = 0.04, segments = 3, material = MAT.furnitureWhite, castShadow = true, receiveShadow = true) {
      const r = Math.min(radius, w * 0.45, h * 0.45, d * 0.45);
      const key = `${w.toFixed(3)}_${h.toFixed(3)}_${d.toFixed(3)}_${r.toFixed(3)}_${segments}`;
      let geom = roundedBoxCache.get(key);
      if (!geom) {
        geom = new RoundedBoxGeometry(w, h, d, segments, r);
        roundedBoxCache.set(key, geom);
      }
      const mesh = new THREE.Mesh(geom, material);
      mesh.castShadow = castShadow;
      mesh.receiveShadow = receiveShadow;
      return mesh;
    }

    // Rich contact shadow blob placed directly on surfaces to ground furniture
    const shadowTex = (() => {
      const c = document.createElement('canvas');
      c.width = c.height = 128;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(64, 64, 8, 64, 64, 62);
      g.addColorStop(0, 'rgba(32, 18, 10, 0.56)');
      g.addColorStop(0.55, 'rgba(32, 18, 10, 0.24)');
      g.addColorStop(1, 'rgba(32, 18, 10, 0.0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(c);
    })();
    const contactShadowMat = new THREE.MeshBasicMaterial({
      map: shadowTex,
      transparent: true,
      depthWrite: false
    });

    function addContactShadow(parent, w, d, x = 0, y = 0.004, z = 0, opacity = 0.92) {
      const m = contactShadowMat.clone();
      m.opacity = opacity;
      const plane = new THREE.Mesh(new THREE.PlaneGeometry(w, d), m);
      plane.rotation.x = -Math.PI / 2;
      plane.position.set(x, y, z);
      parent.add(plane);
      return plane;
    }

    // Soft warm 3000K floor/wall glow decal to emulate bounced area light from linear LED strips
    const warmGlowTex = (() => {
      const c = document.createElement('canvas');
      c.width = c.height = 128;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(64, 64, 4, 64, 64, 62);
      g.addColorStop(0, 'rgba(255, 165, 45, 0.68)');
      g.addColorStop(0.45, 'rgba(255, 138, 25, 0.30)');
      g.addColorStop(1, 'rgba(255, 120, 15, 0.0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(c);
    })();

    function addWarmGlowPool(parent, w, d, x = 0, y = 0.006, z = 0, opacity = 0.85) {
      const mat = new THREE.MeshBasicMaterial({
        map: warmGlowTex,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        opacity
      });
      const plane = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat);
      plane.rotation.x = -Math.PI / 2;
      plane.position.set(x, y, z);
      parent.add(plane);
      return plane;
    }

    function addWallWarmGlow(parent, w, h, x, y, z, rotY = 0, opacity = 0.72) {
      const mat = new THREE.MeshBasicMaterial({
        map: warmGlowTex,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        opacity,
        side: THREE.DoubleSide
      });
      const plane = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
      plane.position.set(x, y, z);

    function createLedStrip(w, h, d, withLight = false, lightIntensity = 1.15, lightDistance = 3.2) {

    // ============================================================================
    // 5. PROCEDURAL PLANTS & POTS (ASSET 24)
    // ============================================================================
    // Shared custom tapered leaf geometry with natural arch
    function createLeafGeometry(length = 0.28, width = 0.11, curve = 0.08) {
      const shape = new THREE.Shape();
      shape.moveTo(0, 0);
      shape.quadraticCurveTo(width, length * 0.45, 0, length);
      shape.quadraticCurveTo(-width, length * 0.45, 0, 0);
      const geom = new THREE.ShapeGeometry(shape, 6);
      const pos = geom.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const y = pos.getY(i);
        const t = y / length;
        // Arch the leaf outward along Z as it grows
        const z = -Math.pow(t, 1.7) * curve;
        pos.setZ(i, z);
      }
      geom.computeVertexNormals();
      return geom;
    }

    const LEAF_GEOM_SMALL = createLeafGeometry(0.18, 0.065, 0.05);
    const LEAF_GEOM_MED = createLeafGeometry(0.34, 0.12, 0.11);
    const LEAF_GEOM_LARGE = createLeafGeometry(0.55, 0.19, 0.18);
    const LEAF_GEOM_VINE = createLeafGeometry(0.11, 0.055, 0.02);

    function createPot(radiusTop = 0.16, radiusBottom = 0.12, height = 0.26, potMat = MAT.furnitureWhite) {
      const group = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.CylinderGeometry(radiusTop, radiusBottom, height, 18),
        potMat
      );
      body.position.y = height / 2;
      body.castShadow = true;
      body.receiveShadow = true;
      group.add(body);

      const rim = new THREE.Mesh(
        new THREE.TorusGeometry(radiusTop * 0.98, radiusTop * 0.08, 8, 18),
        potMat
      );
      rim.rotation.x = Math.PI / 2;
      rim.position.y = height - 0.01;
      group.add(rim);

      const soil = new THREE.Mesh(
        new THREE.CylinderGeometry(radiusTop * 0.92, radiusTop * 0.92, 0.03, 14),
        MAT.soilDark
      );
      soil.position.y = height - 0.02;
      group.add(soil);

      return group;
    }

    function createPlant(options = {}) {
      const {
        type = 'medium', // 'small', 'succulent', 'medium', 'tall', 'hanging'
        potColor = 'white',
        scale = 1.0,
        vineLength = 0.9
      } = options;

      const group = new THREE.Group();
      const potMat =
        potColor === 'pink' ? MAT.pastelPink :
        potColor === 'beige' ? MAT.potBeige :
        potColor === 'terracotta' ? MAT.potTerracotta :
        MAT.furnitureWhite;

      if (type === 'small' || type === 'succulent') {
        const potH = 0.16;
        const pot = createPot(0.095, 0.075, potH, potMat);
        group.add(pot);

        const count = type === 'succulent' ? 14 : 9;
        for (let i = 0; i < count; i++) {
          const leaf = new THREE.Mesh(LEAF_GEOM_SMALL, MAT.leafGreens[i % MAT.leafGreens.length]);
          leaf.castShadow = true;
          const angle = (i / count) * Math.PI * 2 + (i % 2) * 0.3;
          const tilt = type === 'succulent' ? 0.35 + (i % 3) * 0.22 : 0.25 + (i % 4) * 0.18;
          leaf.position.set(0, potH - 0.01, 0);
          leaf.rotation.order = 'YXZ';
          leaf.rotation.y = angle;
          leaf.rotation.x = tilt;
          const s = 0.65 + (i % 3) * 0.2;
          leaf.scale.set(s, s, s);
          group.add(leaf);
        }
      } else if (type === 'medium') {
        const potH = 0.26;
        const pot = createPot(0.15, 0.115, potH, potMat);
        group.add(pot);

        const count = 13;
        for (let i = 0; i < count; i++) {
          const leaf = new THREE.Mesh(LEAF_GEOM_MED, MAT.leafGreens[i % MAT.leafGreens.length]);
          leaf.castShadow = true;
          const angle = (i / count) * Math.PI * 2 + Math.sin(i * 2.1) * 0.2;
          const layer = i % 3;
          leaf.position.set(Math.cos(angle) * 0.02, potH, Math.sin(angle) * 0.02);
          leaf.rotation.order = 'YXZ';
          leaf.rotation.y = angle;
          leaf.rotation.x = 0.22 + layer * 0.24;
          const s = 0.8 + layer * 0.16;
          leaf.scale.set(s, s, s);
          group.add(leaf);
        }
      } else if (type === 'tall') {
        const potH = 0.38;
        const pot = createPot(0.22, 0.16, potH, potMat);
        group.add(pot);

        const count = 16;
        for (let i = 0; i < count; i++) {
          const leaf = new THREE.Mesh(LEAF_GEOM_LARGE, MAT.leafGreens[i % MAT.leafGreens.length]);
          leaf.castShadow = true;
          const angle = (i / count) * Math.PI * 2 + (i % 2) * 0.18;
          const layer = i % 4;
          leaf.position.set(Math.cos(angle) * 0.03, potH + 0.02, Math.sin(angle) * 0.03);
          leaf.rotation.order = 'YXZ';
          leaf.rotation.y = angle;
          leaf.rotation.x = 0.18 + layer * 0.2;
          const s = 0.82 + (3 - layer) * 0.14;
          leaf.scale.set(s, s, s);
          group.add(leaf);
        }
      } else if (type === 'hanging') {
        const potH = 0.22;
        const pot = createPot(0.14, 0.105, potH, potMat);
        group.add(pot);

        // Top bushy crown
        for (let i = 0; i < 12; i++) {
          const leaf = new THREE.Mesh(LEAF_GEOM_SMALL, MAT.leafGreens[i % MAT.leafGreens.length]);
          leaf.castShadow = true;
          const angle = (i / 12) * Math.PI * 2;
          leaf.position.set(0, potH, 0);
          leaf.rotation.order = 'YXZ';
          leaf.rotation.y = angle;
          leaf.rotation.x = 0.3 + (i % 3) * 0.25;
          group.add(leaf);
        }

        // Trailing vine cascades hanging over the front/side edge (+Z and +X)
        const vineStrands = 6;
        for (let v = 0; v < vineStrands; v++) {
          const strandAngle = -0.5 + (v / (vineStrands - 1)) * 1.8;
          const startX = Math.cos(strandAngle) * 0.13;
          const startZ = Math.sin(strandAngle) * 0.13;
          const leavesInStrand = 8 + (v % 4) * 3;
          const strandLen = vineLength * (0.65 + (v % 3) * 0.22);

          for (let k = 0; k < leavesInStrand; k++) {
            const t = k / leavesInStrand;
            const vLeaf = new THREE.Mesh(LEAF_GEOM_VINE, MAT.leafGreens[(v + k) % MAT.leafGreens.length]);
            vLeaf.castShadow = true;
            const sway = Math.sin(t * Math.PI * 3 + v) * 0.03;
            vLeaf.position.set(
              startX * (1 + t * 0.35) + sway,
              potH - t * strandLen,
              startZ * (1 + t * 0.35) + sway
            );
            vLeaf.rotation.set(Math.PI * 0.65 + (k % 2) * 0.25, strandAngle + k * 0.7, 0.2);
            group.add(vLeaf);
          }
        }
      }

      group.scale.setScalar(scale);
      return group;
    }

    // Asset 27: Books, Notebooks, Pencil Cup & Mug helpers
    const BOOK_COLORS = [
      0xf48fb1, 0x9575cd, 0x4fc3f7, 0xffb74d, 0x81c784, 0xf06292, 0x7986cb, 0xffd54f
    ].map(c => registerMat(new THREE.MeshStandardMaterial({ color: c, roughness: 0.5 })));

    function createBookStack(count = 3, horizontal = true) {
      const group = new THREE.Group();
      if (horizontal) {
        let curY = 0;
        for (let i = 0; i < count; i++) {
          const bw = 0.24 - (i % 2) * 0.02;
          const bh = 0.042;
          const bd = 0.32 - (i % 2) * 0.02;
          const cover = createRoundedBox(bw, bh, bd, 0.006, 2, BOOK_COLORS[i % BOOK_COLORS.length]);
          cover.position.y = curY + bh / 2;
          cover.rotation.y = (i % 2 === 0 ? 1 : -1) * 0.06;
          group.add(cover);
          curY += bh;
        }
      } else {
        // Vertical row of books for shelves
        let curX = 0;
        for (let i = 0; i < count; i++) {
          const bw = 0.042 + (i % 3) * 0.012;
          const bh = 0.24 + (i % 2) * 0.04;
          const bd = 0.22;
          const book = createRoundedBox(bw, bh, bd, 0.005, 2, BOOK_COLORS[(i * 2) % BOOK_COLORS.length]);
          book.position.set(curX + bw / 2, bh / 2, 0);
          if (i === count - 1 && count > 3) {
            book.rotation.z = -0.22;
            book.position.x += 0.03;
          }
          group.add(book);
          curX += bw + 0.006;
        }
      }
      return group;
    }

      trimSlab.position.set(0, -0.08, 0);
      floorGroup.add(trimSlab);

      // 2. Golden Oak Wood Plank Floor Strips (top surface at y = 0.0)
      const floorWidth = 11.15;
      const floorDepth = 10.35;
      const numRows = 40;
      const plankDepth = floorDepth / numRows;

      for (let r = 0; r < numRows; r++) {
        const z = -floorDepth / 2 + (r + 0.5) * plankDepth;
        const split1 = -2.2 + ((r * 1.7) % 1.8);
        const split2 = 1.6 + ((r * 1.3) % 1.8);
        const segments = [
          [-floorWidth / 2, split1],
          [split1, split2],
          [split2, floorWidth / 2]
        ];

        segments.forEach(([xStart, xEnd], sIdx) => {
          const pw = xEnd - xStart - 0.012;
          const pd = plankDepth - 0.010;
          const mat = MAT.oakPlanks[(r + sIdx * 2) % MAT.oakPlanks.length];
          const plank = new THREE.Mesh(new THREE.BoxGeometry(pw, 0.06, pd), mat);
          // Top of plank is exactly at y = 0.0 (well above trimSlab at y = -0.02)
          plank.position.set((xStart + xEnd) / 2, -0.03, z);
          plank.receiveShadow = true;
          floorGroup.add(plank);
        });
      }

      // 3. Front Entrance Wooden Steps Cutout (around x = 0.55, z = -5.25)
      const stepGroup = new THREE.Group();
      stepGroup.position.set(0.55, 0, -5.25);

      const step1Base = createRoundedBox(1.85, 0.16, 0.42, 0.03, 2, MAT.platformGray);

      stepGroup.add(step1Wood);

      const step2Base = createRoundedBox(1.92, 0.14, 0.42, 0.03, 2, MAT.platformGray);
      step2Base.position.set(0, -0.31, -0.45);
      stepGroup.add(step2Base);

      const step2Wood = createRoundedBox(1.86, 0.05, 0.38, 0.015, 2, MAT.oakPlanks[2]);
      step2Wood.position.set(0, -0.22, -0.45);
      stepGroup.add(step2Wood);

      // Warm LED strip under step nosing
      const stepLed = createLedStrip(1.72, 0.02, 0.02, false);
      stepLed.position.set(0, -0.06, 0.02);
      stepGroup.add(stepLed);

      floorGroup.add(stepGroup);
      officeGroup.add(floorGroup);

    // ============================================================================
    function setupLighting() {
      // 1. Balanced Warm-Sky / Cool-Slate Hemisphere Light (preserves rich shadow contrast)
      const hemiLight = new THREE.HemisphereLight(0xfff5eb, 0x7b8296, 0.52);
      hemiLight.position.set(0, 20, 0);
      scene.add(hemiLight);

      // 2. Primary Soft Directional Key Light positioned to create crisp 3D wall face separation & soft floor shadows
      const dirLight = new THREE.DirectionalLight(0xfff1e0, 1.38);
      dirLight.position.set(-18, 24, -7);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      dirLight.shadow.camera.near = 2;
      dirLight.shadow.camera.far = 50;
      const d = 10.2;
      dirLight.shadow.camera.left = -d;
      dirLight.shadow.camera.right = d;
      dirLight.shadow.camera.top = d;
      dirLight.shadow.camera.bottom = -d;
      dirLight.shadow.bias = -0.0005;
      dirLight.shadow.radius = 2.5;
      scene.add(dirLight);

      // 3. Restrained Cool-Slate Rim/Fill Light from the right-front cutaway side
      const fillLight = new THREE.DirectionalLight(0xc9d4f0, 0.28);
      fillLight.position.set(14, 10, -16);
      scene.add(fillLight);

      // 4. Warm 3000K Interior Architectural Accent Lights (short range so they warm the nooks without washing out walls)
      const coffeeBounce = new THREE.PointLight(0xff9628, 1.25, 4.8, 1.8);
      coffeeBounce.position.set(4.1, 2.2, 3.8);
      scene.add(coffeeBounce);

      const dashBounce = new THREE.PointLight(0xff9e32, 0.95, 5.5, 1.8);
      dashBounce.position.set(0.4, 1.6, 3.8);

    // ============================================================================
    // 15B. CUTE FUTURISTIC COMPANION ROBOT IN THE OFFICE
    // ============================================================================
    function smoothstepRobot(edge0, edge1, x) {
      const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
      return t * t * (3 - 2 * t);
    }

    function spowRobot(val, exp) {
      return Math.sign(val) * Math.pow(Math.abs(val), exp);
    }

    function roundedRectSDFRobot(x, y, halfW, halfH, cornerRadius) {
      const qx = Math.abs(x) - (halfW - cornerRadius);
      const qy = Math.abs(y) - (halfH - cornerRadius);
      const outDist = Math.hypot(Math.max(qx, 0), Math.max(qy, 0));
      const inDist = Math.min(Math.max(qx, qy), 0);
      return (outDist + inDist - cornerRadius) / cornerRadius;
    }

    function getRoundedRectPerimeterPointRobot(angle, halfW, halfH, cornerR) {
      const r = Math.min(cornerR, Math.min(halfW, halfH) * 0.96);
      const iw = Math.max(0.001, halfW - r);
      const ih = Math.max(0.001, halfH - r);
      const cosA = Math.cos(angle);
      const sinA = Math.sin(angle);
      const sx = spowRobot(cosA, 0.74) * halfW;
      const sy = spowRobot(sinA, 0.74) * halfH;
      const cx = Math.max(-iw, Math.min(iw, sx));
      const cy = Math.max(-ih, Math.min(ih, sy));
      let dx = sx - cx;
      let dy = sy - cy;
      const len = Math.hypot(dx, dy);
      if (len > 1e-5) {
        dx = (dx / len) * r;
        dy = (dy / len) * r;
      }
      return { x: cx + dx, y: cy + dy };
    }

    const VISOR_CENTER_Y = -0.15;
    const VISOR_HALF_W = 2.58;
    const VISOR_HALF_H = 1.98;
    const VISOR_CORNER_R = 1.42;
    const FOOT_ARCH_HALF_SPAN = 0.79;
    const FOOT_SOLE_TOP_Y = 0.14;
    const FOOT_ARCH_PEAK_Y = 0.54;
    const HIP_PIVOT_Y = 1.52;

    function evaluateHelmetUnrecessedPoint(nx, ny, nz) {
      const halfW = 3.38;
      const halfH = 2.66;
      const halfD = 2.60;
      const ex = nx * halfW;
      const ey = ny * halfH;
      const ez = nz * halfD;
      const sx = spowRobot(nx, 0.78) * halfW;
      const sy = spowRobot(ny, 0.80) * halfH;
      const sz = spowRobot(nz, 0.80) * halfD;

      let x = THREE.MathUtils.lerp(sx, ex * 1.03, 0.52);
      let y = THREE.MathUtils.lerp(sy, ey * 1.03, 0.52);
      let z = THREE.MathUtils.lerp(sz, ez * 1.02, 0.52);

      const yNorm = y / halfH;
      const horizR2 = (x / halfW) * (x / halfW) + (z / halfD) * (z / halfD);

      if (y > 0) {
        y += 0.17 * Math.max(0, 1.0 - horizR2 * 0.75) * smoothstepRobot(0.0, 0.95, yNorm);
        const topCornerSoft = 1.0 - 0.045 * Math.pow(Math.max(0, yNorm), 1.8);
        x *= topCornerSoft;
      } else {
        const chinSoft = 1.0 - 0.068 * Math.pow(Math.abs(yNorm), 1.75);
        x *= chinSoft;
        y *= 1.0 - 0.05 * Math.max(0, 1.0 - horizR2) * smoothstepRobot(-0.3, -1.0, yNorm);
      }
      return { x, y, z };
    }

    function evaluateHelmetFrontEnvelopeZ(x, y) {
      const u = x / 3.36;
      const v = y / 2.66;
      const r2 = u * u + v * v;
      const zSphere = Math.sqrt(Math.max(0.08, 1.0 - 0.82 * u * u - 0.80 * v * v));
      const zSquircle = Math.pow(zSphere, 0.86);
      return 2.63 * THREE.MathUtils.lerp(zSquircle, zSphere, 0.50) - 0.04 * r2 * r2;
    }

    function evaluateVisorSurfaceZ(x, y) {
      const envZ = evaluateHelmetFrontEnvelopeZ(x, y);
      const sdf = roundedRectSDFRobot(x, y - VISOR_CENTER_Y, VISOR_HALF_W, VISOR_HALF_H, VISOR_CORNER_R);
      const centerDome = (1.0 - smoothstepRobot(-0.85, 0.0, sdf)) * 0.052;
      return envZ - 0.064 + centerDome;
    }

    function createRobotEnvironments(rendererInstance) {
      const pmrem = new THREE.PMREMGenerator(rendererInstance);
      pmrem.compileEquirectangularShader();

      const bodyCanvas = document.createElement('canvas');
      bodyCanvas.width = 512;
      bodyCanvas.height = 256;
      const bCtx = bodyCanvas.getContext('2d');
      const bGrad = bCtx.createLinearGradient(0, 0, 0, 256);
      bGrad.addColorStop(0.0, '#FFFDFB');
      bGrad.addColorStop(0.38, '#F6EAE2');
      bGrad.addColorStop(0.68, '#D8C7BE');
      bGrad.addColorStop(1.0, '#B9A69E');
      bCtx.fillStyle = bGrad;
      bCtx.fillRect(0, 0, 512, 256);

      const bSoftbox = bCtx.createRadialGradient(290, 58, 12, 290, 58, 170);
      bSoftbox.addColorStop(0.0, 'rgba(255, 253, 250, 0.98)');
      bSoftbox.addColorStop(0.5, 'rgba(255, 244, 235, 0.45)');
      bSoftbox.addColorStop(1.0, 'rgba(240, 224, 214, 0.0)');
      bCtx.fillStyle = bSoftbox;
      bCtx.fillRect(0, 0, 512, 256);

      const bodyTex = new THREE.CanvasTexture(bodyCanvas);
      bodyTex.mapping = THREE.EquirectangularReflectionMapping;
      bodyTex.colorSpace = THREE.SRGBColorSpace;
      const bodyEnvMap = pmrem.fromEquirectangular(bodyTex).texture;
      bodyTex.dispose();

      const visorCanvas = document.createElement('canvas');
      visorCanvas.width = 1024;
      visorCanvas.height = 512;
      const vCtx = visorCanvas.getContext('2d');
      vCtx.fillStyle = '#020305';
      vCtx.fillRect(0, 0, 1024, 512);

      vCtx.save();
      vCtx.translate(1024 * 0.59, 512 * 0.24);
      vCtx.rotate(-0.28);
      const sbGrad = vCtx.createRadialGradient(0, 0, 4, 0, 0, 82);
      sbGrad.addColorStop(0.0, 'rgba(255, 255, 255, 0.62)');
      sbGrad.addColorStop(0.45, 'rgba(235, 238, 246, 0.30)');
      sbGrad.addColorStop(0.80, 'rgba(170, 175, 188, 0.06)');
      sbGrad.addColorStop(1.0, 'rgba(0, 0, 0, 0)');
      vCtx.fillStyle = sbGrad;
      vCtx.scale(1.42, 0.54);
      vCtx.beginPath();
      vCtx.arc(0, 0, 82, 0, Math.PI * 2);
      vCtx.fill();
      vCtx.restore();

      const visorTex = new THREE.CanvasTexture(visorCanvas);
      visorTex.mapping = THREE.EquirectangularReflectionMapping;
      visorTex.colorSpace = THREE.SRGBColorSpace;
      const visorEnvMap = pmrem.fromEquirectangular(visorTex).texture;
      visorTex.dispose();

      pmrem.dispose();
      return { bodyEnvMap, visorEnvMap };
    }

    function createNeonTubeMaterial({ name, coreColorHex, midColorHex, edgeColorHex, coreBoost = 1.35 }) {
      const mat = registerMat(new THREE.MeshBasicMaterial({
        name,
        color: new THREE.Color('#FFFFFF')
      }));

      const uCore = new THREE.Color(coreColorHex);
      const uMid = new THREE.Color(midColorHex);
      const uEdge = new THREE.Color(edgeColorHex);
      const uIntensity = { value: 1.0 };
      mat.userData.uIntensity = uIntensity;

      mat.onBeforeCompile = (shader) => {
        shader.uniforms.uCoreColor = { value: uCore };
        shader.uniforms.uMidColor = { value: uMid };
        shader.uniforms.uEdgeColor = { value: uEdge };
        shader.uniforms.uCoreBoost = { value: coreBoost };
        shader.uniforms.uIntensity = uIntensity;

        shader.vertexShader = shader.vertexShader.replace(
          '#include <common>',
          `#include <common>
          varying vec3 vTubeNormalView;
          varying vec3 vTubeViewDir;`
        );
        shader.vertexShader = shader.vertexShader.replace(
          '#include <project_vertex>',
          `#include <project_vertex>
          vTubeNormalView = normalize(normalMatrix * normal);
          vTubeViewDir = normalize(-mvPosition.xyz);`
        );
        shader.fragmentShader = shader.fragmentShader.replace(
          '#include <common>',
          `#include <common>
          uniform vec3 uCoreColor;
          uniform vec3 uMidColor;
          uniform vec3 uEdgeColor;
          uniform float uCoreBoost;
          uniform float uIntensity;
          varying vec3 vTubeNormalView;
          varying vec3 vTubeViewDir;`
        );
        shader.fragmentShader = shader.fragmentShader.replace(
          'vec4 diffuseColor = vec4( diffuse, opacity );',
          `float ndotv = clamp(dot(normalize(vTubeNormalView), normalize(vTubeViewDir)), 0.0, 1.0);
          float coreFactor = smoothstep(0.36, 0.92, ndotv);
          float midFactor = smoothstep(0.05, 0.62, ndotv);
          vec3 neonCol = mix(uEdgeColor, uMidColor, midFactor);
          neonCol = mix(neonCol, uCoreColor * uCoreBoost, coreFactor);
          vec4 diffuseColor = vec4(neonCol * uIntensity, opacity);`
        );
      };
      return mat;
    }

    function createHelmetShellGeometry() {
      const widthSegs = 96;
      const heightSegs = 72;
      const geom = new THREE.SphereGeometry(1, widthSegs, heightSegs);
      const pos = geom.attributes.position;
      const v = new THREE.Vector3();

      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i).normalize();
        let { x, y, z } = evaluateHelmetUnrecessedPoint(v.x, v.y, v.z);

        const foreheadSeamDist = Math.abs(y - 1.66);
        if (foreheadSeamDist < 0.030 && z > -0.2) {
          const groove = 1.0 - foreheadSeamDist / 0.030;
          const mask = smoothstepRobot(-0.2, 0.6, z);
          const depth = 0.014 * groove * groove * mask;
          x -= v.x * depth;
          y -= v.y * depth;
          z -= v.z * depth;
        }

        const sideSeamDist = Math.abs(y + 0.18);
        if (sideSeamDist < 0.028 && Math.abs(x) > 2.40) {
          const groove = 1.0 - sideSeamDist / 0.028;
          const mask = smoothstepRobot(2.40, 2.80, Math.abs(x));
          const depth = 0.014 * groove * groove * mask;
          x -= v.x * depth;
          z -= v.z * depth;
        }

        if (z > 0.25) {
          const sdf = roundedRectSDFRobot(
            x,
            y - VISOR_CENTER_Y,
            VISOR_HALF_W + 0.048,
            VISOR_HALF_H + 0.048,
            VISOR_CORNER_R + 0.048
          );
          const envBlend = 1.0 - smoothstepRobot(0.0, 0.34, sdf);
          if (envBlend > 0) {
            const envZ = evaluateHelmetFrontEnvelopeZ(x, y);
            z = THREE.MathUtils.lerp(z, envZ, envBlend);
          }
          if (sdf > -0.02 && sdf < 0.065) {
            const rimGroove = Math.sin(((sdf + 0.02) / 0.085) * Math.PI);
            z -= 0.018 * rimGroove;
          }
          if (sdf < 0.028) {
            const recessT = 1.0 - smoothstepRobot(-0.08, 0.028, sdf);
            const envZ = evaluateHelmetFrontEnvelopeZ(x, y);
            z = THREE.MathUtils.lerp(z, envZ - 0.32, recessT);
          }
        }
        pos.setXYZ(i, x, y, z);
      }
      geom.computeVertexNormals();
      return geom;
    }

    function createCurvedVisorGeometry(halfW, halfH, cornerR, zOffset = 0, rimDepth = 0.15) {
      const angularSteps = 96;
      const radialSteps = 32;
      const geom = new THREE.BufferGeometry();
      const vertices = [];
      const uvs = [];
      const indices = [];

      for (let j = 0; j <= radialSteps; j++) {
        const vFrac = j / radialSteps;
        let radialScale;
        let edgeWrapZ = 0;
        if (vFrac <= 0.86) {
          radialScale = Math.pow(vFrac / 0.86, 0.88);
        } else {
          const bevelT = (vFrac - 0.86) / 0.14;
          radialScale = 1.0 + 0.010 * Math.sin(bevelT * Math.PI);
          edgeWrapZ = -rimDepth * (1.0 - Math.cos(bevelT * Math.PI * 0.5));
        }

        for (let i = 0; i <= angularSteps; i++) {
          const uFrac = i / angularSteps;
          const angle = uFrac * Math.PI * 2;
          const pt = getRoundedRectPerimeterPointRobot(
            angle,
            halfW * radialScale,
            halfH * radialScale,
            cornerR * radialScale
          );
          const x = pt.x;
          const y = pt.y + VISOR_CENTER_Y;
          const z = evaluateVisorSurfaceZ(x, y) + zOffset + edgeWrapZ;
          vertices.push(x, y, z);
          uvs.push(0.5 + x / (halfW * 2), 0.5 + (y - VISOR_CENTER_Y) / (halfH * 2));
        }
      }

      const stride = angularSteps + 1;
      for (let j = 0; j < radialSteps; j++) {
        for (let i = 0; i < angularSteps; i++) {
          const a = j * stride + i;
          const b = a + 1;
          const c = (j + 1) * stride + i;
          const d = c + 1;
          indices.push(a, c, d);
          indices.push(a, d, b);
        }
      }

      geom.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
      geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geom.setIndex(indices);
      geom.computeVertexNormals();
      return geom;
    }

    function createVisorSoftboxReflectionMesh() {
      const uSteps = 32;
      const vSteps = 14;
      const geom = new THREE.BufferGeometry();
      const vertices = [];
      const colors = [];
      const indices = [];

      const angleStart = THREE.MathUtils.degToRad(22);
      const angleEnd = THREE.MathUtils.degToRad(76);

      for (let j = 0; j <= vSteps; j++) {
        const vFrac = j / vSteps;
        const rScale = THREE.MathUtils.lerp(0.76, 0.95, vFrac);
        const radialFade = Math.sin(vFrac * Math.PI);

        for (let i = 0; i <= uSteps; i++) {
          const uFrac = i / uSteps;
          const angle = THREE.MathUtils.lerp(angleStart, angleEnd, uFrac);
          const angularFade = Math.sin(uFrac * Math.PI);
          const pt = getRoundedRectPerimeterPointRobot(
            angle,
            VISOR_HALF_W * rScale,
            VISOR_HALF_H * rScale,
            VISOR_CORNER_R * rScale
          );
          const x = pt.x;
          const y = pt.y + VISOR_CENTER_Y;
          const z = evaluateVisorSurfaceZ(x, y) + 0.003;
          vertices.push(x, y, z);
          const intensity = Math.pow(radialFade * angularFade, 1.40) * 0.18;
          colors.push(intensity, intensity, intensity * 1.05);
        }
      }

      const stride = uSteps + 1;
      for (let j = 0; j < vSteps; j++) {
        for (let i = 0; i < uSteps; i++) {
          const a = j * stride + i;
          const b = a + 1;
          const c = (j + 1) * stride + i;
          const d = c + 1;
          indices.push(a, c, d);
          indices.push(a, d, b);
        }
      }

      geom.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
      geom.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geom.setIndex(indices);

      const mat = new THREE.MeshBasicMaterial({
        vertexColors: true,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      return new THREE.Mesh(geom, mat);
    }

    function createRobotVisor(materials) {
      const visorGroup = new THREE.Group();
      const bezelGeom = createCurvedVisorGeometry(
        VISOR_HALF_W + 0.068,

      const screenGeom = createCurvedVisorGeometry(

      visorGroup.add(new THREE.Mesh(screenGeom, materials.visorGlass));

      const reflectionMesh = createVisorSoftboxReflectionMesh();
      reflectionMesh.position.z = 0.022;

      return visorGroup;
    }

    function createLocalVisorStroke(localPoints2D, anchorX, anchorY, radius, coreMat, zLift = 0.026, sheathMat = null, closed = false) {
      const group = new THREE.Group();
      const visorScreenOffset = 0.022;
      const anchorZ = evaluateVisorSurfaceZ(anchorX, anchorY) + visorScreenOffset + zLift;
      group.position.set(anchorX, anchorY, anchorZ);

      const points3D = localPoints2D.map(([lx, ly]) => {
        const wx = anchorX + lx;
        const wy = anchorY + ly;
        const wz = evaluateVisorSurfaceZ(wx, wy) + visorScreenOffset + zLift;
        return new THREE.Vector3(lx, ly, wz - anchorZ);
      });

      const curve = new THREE.CatmullRomCurve3(points3D, closed, 'centripetal', 0.25);
      const coreTubeGeom = new THREE.TubeGeometry(curve, 40, radius, 18, closed);
      group.add(new THREE.Mesh(coreTubeGeom, coreMat));

      if (!closed) {
        const coreCapGeom = new THREE.SphereGeometry(radius, 14, 10);
        const startCap = new THREE.Mesh(coreCapGeom, coreMat);
        startCap.position.copy(points3D[0]);
        group.add(startCap);

        const endCap = new THREE.Mesh(coreCapGeom, coreMat);
        endCap.position.copy(points3D[points3D.length - 1]);
        group.add(endCap);
      }

      if (sheathMat) {
        const sheathRadius = radius * 1.38;
        const sheathTubeGeom = new THREE.TubeGeometry(curve, 32, sheathRadius, 14, closed);
        group.add(new THREE.Mesh(sheathTubeGeom, sheathMat));

        if (!closed) {
          const sheathCapGeom = new THREE.SphereGeometry(sheathRadius, 12, 8);
          const sCap1 = new THREE.Mesh(sheathCapGeom, sheathMat);
          sCap1.position.copy(points3D[0]);
          group.add(sCap1);

          const sCap2 = new THREE.Mesh(sheathCapGeom, sheathMat);
          sCap2.position.copy(points3D[points3D.length - 1]);
          group.add(sCap2);
        }
      }
      return group;
    }

    function createRobotFace(materials) {
      const faceGroup = new THREE.Group();
      const faceMat = materials.faceEmissive;
      const heartMat = materials.heartEmissive;
      const cheekMat = materials.cheekEmissive;

      const eyeCenterY = -0.32;
      const eyeOffsetX = 1.12;
      const eyeRadiusX = 0.480;
      const eyeRadiusY = 0.465;
      const eyeStrokeRadius = 0.092;
      const steps = 48;

      const leftEyeLocalPts = [];
      const rightEyeLocalPts = [];
      const startAngleL = THREE.MathUtils.degToRad(246);
      const endAngleL = THREE.MathUtils.degToRad(202 + 360);

      for (let i = 0; i <= steps; i++) {
        const a = THREE.MathUtils.lerp(startAngleL, endAngleL, i / steps);
        const lx = Math.cos(a) * eyeRadiusX;
        const ly = Math.sin(a) * eyeRadiusY;
        leftEyeLocalPts.push([lx, ly]);
        rightEyeLocalPts.push([-lx, ly]);
      }

      const leftEyeOpen = createLocalVisorStroke(leftEyeLocalPts, -eyeOffsetX, eyeCenterY, eyeStrokeRadius, faceMat);
      faceGroup.add(leftEyeOpen);

      const rightEyeOpen = createLocalVisorStroke(rightEyeLocalPts, eyeOffsetX, eyeCenterY, eyeStrokeRadius, faceMat);
      faceGroup.add(rightEyeOpen);

      const winkLocalPts = [];
      for (let i = 0; i <= 24; i++) {
        const a = THREE.MathUtils.degToRad(25 + (130 * i) / 24);
        winkLocalPts.push([Math.cos(a) * 0.44, Math.sin(a) * 0.24 - 0.10]);
      }
      const leftEyeWink = createLocalVisorStroke(winkLocalPts, -eyeOffsetX, eyeCenterY, eyeStrokeRadius * 0.94, faceMat);
      leftEyeWink.visible = false;
      faceGroup.add(leftEyeWink);

      const rightEyeWink = createLocalVisorStroke([...winkLocalPts].reverse(), eyeOffsetX, eyeCenterY, eyeStrokeRadius * 0.94, faceMat);
      rightEyeWink.visible = false;
      faceGroup.add(rightEyeWink);

      const sleepyLocalPts = [];
      for (let i = 0; i <= 24; i++) {
        const a = THREE.MathUtils.lerp(THREE.MathUtils.degToRad(205), THREE.MathUtils.degToRad(335), i / 24);
        sleepyLocalPts.push([Math.cos(a) * 0.43, Math.sin(a) * 0.18 + 0.04]);
      }
      const leftEyeSleepy = createLocalVisorStroke(sleepyLocalPts, -eyeOffsetX, eyeCenterY, eyeStrokeRadius * 0.90, faceMat);
      leftEyeSleepy.visible = false;
      faceGroup.add(leftEyeSleepy);

      const rightEyeSleepy = createLocalVisorStroke([...sleepyLocalPts].reverse(), eyeOffsetX, eyeCenterY, eyeStrokeRadius * 0.90, faceMat);
      rightEyeSleepy.visible = false;
      faceGroup.add(rightEyeSleepy);

      const heartLocalPts = [];
      const heartSteps = 48;
      for (let i = 0; i < heartSteps; i++) {
        const t = (i / heartSteps) * Math.PI * 2;
        const hx = 16 * Math.pow(Math.sin(t), 3);
        const hy = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
        heartLocalPts.push([hx * 0.028, (hy - 1.5) * 0.028]);
      }
      const leftEyeHeart = createLocalVisorStroke(heartLocalPts, -eyeOffsetX, eyeCenterY, eyeStrokeRadius * 0.82, heartMat, 0.026, null, true);
      leftEyeHeart.visible = false;
      faceGroup.add(leftEyeHeart);

      const rightEyeHeart = createLocalVisorStroke(heartLocalPts, eyeOffsetX, eyeCenterY, eyeStrokeRadius * 0.82, heartMat, 0.026, null, true);
      rightEyeHeart.visible = false;
      faceGroup.add(rightEyeHeart);

      const mouthAnchorY = -0.64;
      const smileLocalPts = [];
      const mouthStart = THREE.MathUtils.degToRad(200);
      const mouthEnd = THREE.MathUtils.degToRad(340);
      for (let i = 0; i <= 28; i++) {
        const a = THREE.MathUtils.lerp(mouthStart, mouthEnd, i / 28);
        smileLocalPts.push([Math.cos(a) * 0.270, 0.10 + Math.sin(a) * 0.185]);
      }
      const mouthSmile = createLocalVisorStroke(smileLocalPts, 0, mouthAnchorY, 0.076, faceMat);
      faceGroup.add(mouthSmile);

      const surprisedLocalPts = [];
      for (let i = 0; i < 32; i++) {
        const a = (i / 32) * Math.PI * 2;
        surprisedLocalPts.push([Math.cos(a) * 0.145, Math.sin(a) * 0.165]);
      }
      const mouthSurprised = createLocalVisorStroke(surprisedLocalPts, 0, mouthAnchorY - 0.03, 0.064, faceMat, 0.026, null, true);
      mouthSurprised.visible = false;
      faceGroup.add(mouthSurprised);

      const sadLocalPts = [];
      for (let i = 0; i <= 24; i++) {
        const a = THREE.MathUtils.lerp(THREE.MathUtils.degToRad(28), THREE.MathUtils.degToRad(152), i / 24);
        sadLocalPts.push([Math.cos(a) * 0.24, -0.14 + Math.sin(a) * 0.14]);
      }
      const mouthSad = createLocalVisorStroke(sadLocalPts, 0, mouthAnchorY, 0.070, faceMat);
      mouthSad.visible = false;
      faceGroup.add(mouthSad);

      const cheeksGroup = new THREE.Group();
      const cheekMarksList = [];
      const cheekY = -1.06;
      const cheekSpacing = 0.22;
      const slantDX = 0.048;
      const slantDY = 0.082;
      const cheekStrokeRadius = 0.042;

      [-1.25, 1.25].forEach((baseX) => {
        const sideCheekGroup = new THREE.Group();
        for (let m = 0; m < 2; m++) {
          const offsetX = (m - 0.5) * cheekSpacing;
          const cx = baseX + offsetX;
          const markLocalPts = [
            [-slantDX, -slantDY],
            [0, 0],
            [slantDX, slantDY]
          ];
          const cheekMark = createLocalVisorStroke(
            markLocalPts,
            cx,
            cheekY,
            cheekStrokeRadius,
            cheekMat,
            0.022,
            materials.cheekGlowSheath
          );
          sideCheekGroup.add(cheekMark);
          cheekMarksList.push(cheekMark);
        }
        cheeksGroup.add(sideCheekGroup);
      });
      faceGroup.add(cheeksGroup);

      faceGroup.userData.parts = {
        leftEyeOpen,
        rightEyeOpen,
        leftEyeWink,
        rightEyeWink,
        leftEyeSleepy,
        rightEyeSleepy,
        leftEyeHeart,
        rightEyeHeart,
        mouthSmile,
        mouthSurprised,
        mouthSad,
        cheeksGroup,
        cheekMarksList
      };

      return faceGroup;
    }

    function createRobotEarModules(materials) {
      const earsGroup = new THREE.Group();

      function applyEarOvalScale(geom) {

      const glowSheathGeom = applyEarOvalScale(new THREE.TorusGeometry(0.66, 0.130, 18, 48).rotateY(Math.PI / 2));

      const innerDiscPoints = [

        new THREE.Vector2(0.32, 0.42),

      [-1, 1].forEach((side) => {

        ear.add(new THREE.Mesh(innerDiscGeom, materials.earInnerMaterial));

        const glowRing = new THREE.Mesh(glowRingGeom, materials.peachEmissive);
        glowRing.position.x = 0.512;
        ear.add(glowRing);

        const glowSheath = new THREE.Mesh(glowSheathGeom, materials.peachGlowSheath);
        glowSheath.position.x = 0.508;
        ear.add(glowSheath);

        ear.position.set(side * 3.16, -0.18, 0.0);
        if (side < 0) ear.rotation.set(0, Math.PI, 0);
        earsGroup.add(ear);
      });

      return earsGroup;
    }

    function createRobotTopSensor(materials) {
      const sensorGroup = new THREE.Group();
      const basePoints = [
        new THREE.Vector2(0.0, -0.08),

        new THREE.Vector2(0.74, 0.02),

      ];
      const baseMesh = new THREE.Mesh(new THREE.LatheGeometry(basePoints, 48), materials.jointMaterial);
      baseMesh.position.y = 2.71;

      const capPoints = [

        new THREE.Vector2(0.67, 0.06),

        new THREE.Vector2(0.61, 0.23),

    function createSleepZSymbols(materials) {
      const zzzGroup = new THREE.Group();
      zzzGroup.visible = false;
      const zPts = [
        new THREE.Vector3(-0.18, 0.18, 0),
        new THREE.Vector3(0.18, 0.18, 0),

        new THREE.Vector3(0.18, -0.18, 0)
      ];

      function buildSingleZMesh(scale) {
        const singleZ = new THREE.Group();
        const r = 0.042;
        const segs = [
          [zPts[0], zPts[1]],
          [zPts[1], zPts[2]],
          [zPts[2], zPts[3]]
        ];
        const capSphere = new THREE.SphereGeometry(r, 10, 8);
        segs.forEach(([p0, p1]) => {
          const curve = new THREE.LineCurve3(p0, p1);

        zPts.forEach((p) => {

          corner.position.copy(p);
          singleZ.add(corner);

      const items = [buildSingleZMesh(0.75), buildSingleZMesh(1.0), buildSingleZMesh(1.25)];

    }

    function createRobotHead(materials) {
      const headPivot = new THREE.Group();
